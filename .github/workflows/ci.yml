name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Check formatting (black)
        run: black --check --diff colorcast tests
      - name: Check import order (isort)
        run: isort --check-only --diff colorcast tests
      - name: Lint (ruff)
        run: ruff check colorcast tests

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -e ".[dev]"
      - name: Type check (mypy)
        run: mypy colorcast

  test:
    needs: [lint, mypy]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies (Qt headless)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libegl1 libxkbcommon-x11-0
      - name: Install project with dev and analysis extras
        run: pip install -e ".[dev,analysis]"
      - name: Run tests
        if: runner.os == 'Linux'
        run: xvfb-run pytest -q --cov=colorcast --cov-report=term --cov-fail-under=70
        env:
          QT_QPA_PLATFORM: offscreen
